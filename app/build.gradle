// App-module build file for "infinity".
plugins {
    id 'com.android.application'
    // Google Services plugin reads google-services.json and wires up Firebase.
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.infinity.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.infinity.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Multidex can help if the method count grows; safe to keep enabled.
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    // ----- AndroidX / Material UI -----
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // ----- Firebase (managed via the BoM so versions stay compatible) -----
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'

    // ----- Image loading -----
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ----- Rounded / circular profile images -----
    implementation 'de.hdodenhof:circleimageview:3.1.0'
}
