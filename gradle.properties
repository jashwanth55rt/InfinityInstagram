# Project-wide Gradle settings.
# Increase memory for the Gradle daemon (helpful when building larger projects).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is required for modern Android libraries (Material, RecyclerView, etc.).
android.useAndroidX=true

# Generate a per-module R class (smaller, faster builds).
android.nonTransitiveRClass=true

# Enable Gradle parallel/daemon builds for speed.
org.gradle.parallel=true
org.gradle.caching=true
